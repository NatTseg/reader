<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f8f6f0" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="reader" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>reader</title>
    <script src="bible-data.js" defer></script>
    <script src="legacy-web-data.js" defer></script>
    <script src="edition.js" defer></script>
    <script src="study-data.js" defer></script>
    <script src="wisdom-data.js" defer></script>
    <script src="prayers-data.js" defer></script>
    <script src="personal-notes.js" defer></script>
    <script src="persistence.js" defer></script>
    <script src="cloud-config.js" defer></script>
    <script src="cloud-sync.js" defer></script>
    <script src="note-alignment.js" defer></script>
    <script src="reader-tools.js" defer></script>
    <script src="swipe.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <a
          class="brand"
          href="#"
          id="home"
          aria-label="reader — return to reading"
          ><img src="icon.svg" width="34" height="34" alt="" /><span
            >reader</span
          ></a
        >
        <div class="header-actions">
          <button
            class="icon-button"
            id="search"
            aria-label="Search Scripture"
            title="Search Scripture"
            data-icon="search"
          ></button
          ><button
            class="icon-button"
            id="settings"
            aria-label="Reading settings"
            title="Reading settings"
            data-icon="settings"
          ></button>
        </div>
      </header>
      <nav class="chapter-bar" id="chapterBar" aria-label="Chapter navigation">
        <button
          class="icon-button"
          id="previous"
          aria-label="Previous chapter"
          data-icon="left"
        ></button>
        <button
          class="chapter-picker"
          id="books"
          aria-label="Choose book and chapter"
        >
          <span id="reference">John 1</span
          ><span class="picker-label"
            >Books &amp; chapters <span data-icon="down"></span
          ></span>
        </button>
        <button
          class="icon-button"
          id="next"
          aria-label="Next chapter"
          data-icon="right"
        ></button>
        <div class="chapter-tools" id="chapterTools">
          <button
            id="openChapterDrawer"
            aria-label="Open chapters — or swipe left"
            title="Chapters — swipe left to open"
            aria-haspopup="dialog"
            aria-controls="dialog"
          >
            <span data-icon="chapters"></span
            ><span class="chapters-label">Chapters</span>
          </button>
        </div>
      </nav>
      <button class="secondary" id="exitFocus" hidden aria-label="Show reading controls">Show controls</button>
      <main id="pane" tabindex="-1">
        <p class="empty">Opening Scripture…</p>
      </main>
      <button id="returnReading" class="return-reading" hidden>
        Go back
      </button>
      <nav class="tabs" aria-label="Main navigation">
        <button data-tab="bible" aria-current="page">
          <span data-icon="book"></span>Read
        </button>
        <button data-tab="wisdom">
          <span data-icon="compass"></span>Wisdom
        </button>
        <button data-tab="prayers">
          <span data-icon="prayer"></span>Prayers
        </button>
        <button data-tab="saved">
          <span data-icon="bookmark"></span>Saved
        </button>
      </nav>
    </div>
    <dialog id="dialog" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <h2 id="dialogTitle"></h2>
        <button
          class="icon-button"
          id="closeDialog"
          aria-label="Close dialog"
          data-icon="close"
        ></button>
      </div>
      <div id="dialogBody"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>This reader needs JavaScript to open the bundled Bible.</noscript>
  </body>
</html>
